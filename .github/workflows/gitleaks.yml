name: Secret Scan (gitleaks)

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [dev-main, staging, live-mvp]

permissions:
  contents: read
  pull-requests: write

jobs:
  scan:
    name: Scan for committed secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION="8.18.4"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks

      - name: Run gitleaks
        run: |
          if [ -f ".gitleaks.toml" ]; then
            CONFIG_FLAG="--config=.gitleaks.toml"
          else
            CONFIG_FLAG=""
          fi

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            gitleaks detect --source=. $CONFIG_FLAG --log-opts="${{ github.event.pull_request.base.sha }}..HEAD" --verbose
          else
            gitleaks detect --source=. $CONFIG_FLAG --log-opts="HEAD~1..HEAD" --verbose
          fi
