# render.yaml — Render Blueprint for marketeq-projects-vibe
#
# SINGLE shared backend service.
# The backend deploys from `dev-main` and serves every Vercel
# environment. The n8n orchestrator triggers API deploys with
# specific commit SHAs. Auto-deploy is disabled.
#
# Vercel frontend mapping:
#   marketeq-projects-dev      (dev-main)  → shared Render backend
#   marketeq-projects-staging  (staging)   → shared Render backend
#   marketeq-projects-live-mvp (live-mvp)  → shared Render backend
#
# Deploy: Render Dashboard → New → Blueprint → connect marketeq-projects-vibe repo
#
# After deploy:
#   1. Go to Environment Group "marketeq-secrets" and fill in the secrets
#   2. Set NEXT_PUBLIC_API_URL on each Vercel project to the matching Render URL

services:
  # ── Shared backend ──
  - type: web
    name: marketeq-backend
    runtime: docker
    repo: https://github.com/Marketeq/marketeq-projects-vibe.git
    branch: dev-main
    autoDeploy: false
    dockerfilePath: backend/Dockerfile.all
    dockerContext: backend
    region: oregon
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        # localhost removed: a localhost origin here is trusted by CORS and the
        # CSRF check against live data. The gateway now also strips it in
        # production (ALLOW_LOCALHOST_ORIGIN=true overrides, temporarily).
        value: https://live-marketeq-projects.vercel.app,https://staging-marketeq-projects.vercel.app,https://dev-marketeq-projects.vercel.app,https://marketeq-mvp-live.vercel.app,https://marketeq-mvp-dev.vercel.app,https://marketeq-mvp-staging.vercel.app
      # Eleven services read REDIS_URL. It was absent from this blueprint and
      # from the deployed environment, so every one of them fell back to
      # localhost and logged a connection refusal roughly 958 times per log
      # window, which buried real faults. Wired to the instance below.
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: marketeq-keyvalue
          property: connectionString
      # api-gateway request rate limiting. monitor = over-limit requests are
      # logged as WOULD_BLOCK but still served; enforce = they get a 429.
      # Confirm RATE_LIMIT_TRUSTED_PROXY_HOPS against the x-forwarded-for
      # count the gateway logs on startup traffic before switching to enforce.
      - key: RATE_LIMIT_MODE
        value: monitor
      # CSRF: monitor logs cookie-authenticated writes that arrive with no
      # Origin header; enforce rejects them. Unknown origins are rejected in
      # both modes (unchanged behaviour).
      - key: CSRF_STRICT_MODE
        value: monitor
      # user-service /users routes: monitor logs cross-user edits, attempts to
      # set role=ADMIN, and list-all reads; enforce returns 403. Internal
      # service calls are exempt.
      - key: USER_ACCESS_MODE
        value: monitor
      # Privilege escalation is enforced regardless of the mode above: a
      # request trying to set role=admin or platformRole on a /users route is
      # refused. Nothing legitimate does this. Set to monitor to back it out.
      - key: USER_ACCESS_ESCALATION_MODE
        value: enforce
      # "<userId>:admin,<userId>:finance" — the accounts auth-service puts a
      # platformRole claim on. Valid role ids come from
      # platform-roles.catalog.ts (admin, developer, qa, product-manager,
      # finance, support); unknown ids are dropped with a warning.
      # platformRole claim on. Empty means no platform roles exist, which is
      # the current state. Not read from the database on purpose: no HTTP
      # route can reach this, so no request can promote an account. A listed
      # account must also have 2FA enabled: the claim is only minted on a
      # second-factor session, so a password-only or OAuth sign-in carries no
      # role and auth-service logs "platform role withheld: ...".
      - key: PLATFORM_ROLE_ASSIGNMENTS
        value: ""
      - fromGroup: marketeq-secrets

  # ── Shared key value store ──
  # Backs BullMQ queues in scheduling-service and payout-service, and the
  # cache layers in earnings, pricing, favorites and suggestions.
  - type: keyvalue
    name: marketeq-keyvalue
    plan: free
    region: oregon
    maxmemoryPolicy: noeviction
    ipAllowList: []

envVarGroups:
  - name: marketeq-secrets
    envVars:
      # ── Database (Supabase) ──
      - key: DATABASE_URL
        sync: false
      # ── JWT ──
      - key: JWT_SECRET
        sync: false
      - key: AUTH_JWT_PUBLIC_KEY
        sync: false
      - key: AUTH_JWT_PRIVATE_KEY
        sync: false
      - key: AUTH_REFRESH_SECRET
        sync: false
      - key: AUTH_JWT_TOKEN_EXPIRES_IN
        value: "7d"
      - key: AUTH_REFRESH_TOKEN_EXPIRES_IN
        value: "30d"
      - key: INTERNAL_SERVICE_TOKEN
        sync: false
      # ── E2EE key custody (user-service) ──
      # Wraps users' RSA private keys at rest in user_service.user_keys.
      # Generate with: openssl rand -hex 32
      # Required by PUT /user-keys/private-key/backup and
      # GET /user-keys/private-key/restore; without it both return 503 and
      # key recovery is unavailable. It is NOT interchangeable with
      # NEXT_PUBLIC_SYSTEM_SECRET, which must stay unset — see
      # docs/md/CyberSecurity/Client-Side Seed Material — Plan.md.
      # Rotating it makes every existing wrapped private key unreadable, so
      # it needs a re-wrap migration, not a straight swap.
      - key: E2EE_SERVER_SECRET
        sync: false
      # ── OAuth ──
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: LINKEDIN_CLIENT_ID
        sync: false
      - key: LINKEDIN_CLIENT_SECRET
        sync: false
      # ── Cloudflare R2 ──
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_R2_ACCESS_KEY
        sync: false
      - key: CLOUDFLARE_R2_SECRET_KEY
        sync: false
      - key: CLOUDFLARE_R2_BUCKET
        value: marketeq-profile-images
      - key: CLOUDFLARE_R2_ENDPOINT
        sync: false
      - key: CLOUDFLARE_PUBLIC_URL
        value: https://pub-4789db6a57d64de3ad7b5e8c316d125b.r2.dev
      # portfolio-service's case-study media has its own bucket, separate from
      # the profile-image bucket above. Without these two, its presigned
      # uploads fall back to CLOUDFLARE_R2_BUCKET and land in the avatar
      # bucket instead.
      - key: PORTFOLIO_R2_BUCKET
        value: marketeq-portfolio-media
      - key: PORTFOLIO_R2_PUBLIC_URL
        value: https://pub-a66d1bacc56845be8d84370dce1f7747.r2.dev
      # ── Email (Brevo) ──
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_FROM_EMAIL
        sync: false
      - key: BREVO_FROM_NAME
        sync: false
      # ── RabbitMQ ──
      - key: RABBITMQ_URL
        sync: false
      # ── Ably (messaging-service real-time) ──
      - key: ABLY_API_KEY
        sync: false
