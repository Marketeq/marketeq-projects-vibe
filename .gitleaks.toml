title = "Marketeq gitleaks config"

# Extend the default gitleaks ruleset (covers AWS keys, GitHub tokens,
# Stripe keys, generic API keys, private keys, etc.)
[extend]
useDefault = true

# Additional repo-specific rules
[[rules]]
id = "pem-private-key-file"
description = "PEM-encoded private key committed to repo"
regex = '''-----BEGIN (RSA |EC |DSA |OPENSSH |PGP |ENCRYPTED )?PRIVATE KEY-----'''
tags = ["key", "private"]

[[rules]]
id = "dotenv-file"
description = "Committed .env file"
path = '''(^|/)\.env(\..+)?$'''
tags = ["secret", "env"]

# Paths to ignore (generated files, fixtures, lockfiles, etc.)
[allowlist]
description = "Global allowlist"
paths = [
  '''(^|/)\.env(\..+)?\.example$''',
  '''(.*?)package-lock\.json$''',
  '''(.*?)yarn\.lock$''',
  '''(.*?)pnpm-lock\.yaml$''',
  '''(.*?)\.min\.(js|css)$''',
  '''(.*?)dist/''',
  '''(.*?)build/''',
  '''(.*?)node_modules/''',
  '''(.*?)\.next/''',
  '''docs/''',
  # Vendored cal.diy scheduling-service source (backend/apps/scheduling-service/app/).
  # Third-party code we don't author -- test fixtures, example docs, and a
  # git symlink (mode 120000) all trip the default/custom rules with no real
  # secret content. Marketeq's own wrapper files for this service live
  # outside app/ (package.json, scripts/, README.md) and stay scanned.
  '''^backend/apps/scheduling-service/app/''',
  # sop-check.yml contains the pem-private-key-file regex above as a literal
  # string (it's the check that detects PEM headers elsewhere), not a real key.
  '''^\.github/workflows/sop-check\.yml$''',
  # Root README's smoke-test example uses a placeholder header value
  # ("dev-internal-token"), not a real credential.
  '''^README\.md$''',
  # keys.ts strips a PEM header substring via .replace() -- the literal
  # "-----BEGIN PRIVATE KEY-----" appears as a pattern argument, not a key.
  '''^frontend/src/crypto/keys\.ts$''',
]

# Matched values to ignore. Scoped to the exact string so the surrounding file
# stays fully scanned -- a real credential committed there is still caught.
regexes = [
  # listings-service copies a job listing's brief attachment fields across:
  #   if (dto.briefR2Key !== undefined) fields.briefR2Key = dto.briefR2Key;
  # briefR2Key is a Cloudflare R2 object key (a storage path), not a
  # credential. generic-api-key matches the "...Key = ..." shape of the
  # assignment and reports the source text "dto.briefR2Key" as the secret.
  '''^dto\.briefR2Key$''',
  # identity-verification's login-session-key controller spec sets ACCESS_TOKEN to a
  # short, fake JWT-shaped string to prove the raw token never reaches the GET /me
  # response. It is test data, not a credential; generic-api-key matches the
  # "..._TOKEN = ..." assignment.
  '''^eyJhbGciOi\.eyJzdWIiOiJ1c2VyLTEi\.c2lnbmF0dXJl$''',
]
