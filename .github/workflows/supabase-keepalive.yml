name: Supabase Keep-Alive

on:
  schedule:
    # Run every 2 days at 06:00 UTC to prevent free-tier auto-pause
    - cron: '0 6 */2 * *'
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase DB
        run: |
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ACCESS_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"query": "SELECT 1"}' \
            "https://api.supabase.com/v1/projects/${{ secrets.SUPABASE_PROJECT_REF }}/database/query")
          echo "HTTP status: $RESPONSE"
          if [ "$RESPONSE" != "200" ]; then
            echo "Keep-alive ping failed with status $RESPONSE"
            exit 1
          fi
          echo "Supabase project is active"
